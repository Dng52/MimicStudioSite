<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact | Mimic Studio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="shortcut icon" type="image/png" 
      href="{{ "/images/favicon.png"  | absolute_url }}">
<link rel="stylesheet" href="../css/style.css">

</head> <body>
<div class="top-bar">
    <a href="../" class="logo-link">
        <img src="../images/logo.png" alt="Mimic Studio Logo" class="logo">
    </a>

    <header class="site-header">
<nav class="navigation">
    <a href="../">Home</a>
    <a href="../about/">About</a>
    <a href="../contact/">Contact</a>
</nav>

    </header>
</div>

<main class="contact-page">

    <section class="contact-section">

        <h1 class="section-title">Join the Newsletter</h1>

        <p>Get updates about new games and releases. Or contact us at mimicstudiogames@gmail.com</p>

        <form
            action="https://formspree.io/f/xqeyznzo"
            method="POST"
            class="newsletter-form"
        >
            <input
                type="email"
                name="email"
                placeholder="Enter your email address"
                aria-label="Email address"
                required
            >

            <button type="submit">
                Subscribe
            </button>
        </form>

        <div class="contact-logo">
            <img
                src="../images/logo.png"
                alt="Mimic Studio Logo"
            >
        </div>

    </section>

</main>

</body> </html>
